<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maktab Management System</title>
  <meta name="description" content="Simple, clean, mobile-first Maktab Management System for students, attendance, and Sabak tracking." />

  <!-- Preconnect and Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/calendar.css" />
</head>
<body>

  <div class="app-container">
    <!-- Main Header -->
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-identity">
          <div class="brand-icon">م</div>
          <div class="brand-titles">
            <h1 class="brand-name">Maktab Register</h1>
            <span class="brand-tagline">Quran & Islamic Studies</span>
          </div>
        </div>
        <div class="header-status-badge">
          <span style="display:inline-block; width:6px; height:6px; background:#059669; border-radius:50%;"></span>
          Active
        </div>
      </div>

      <!-- Live Search Bar (Active on Students view) -->
      <div id="header-search-bar" class="search-wrapper">
        <span class="search-icon-left">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input type="text" 
               id="search-students-input" 
               class="search-input" 
               placeholder="Search students..." 
               autocomplete="off" />
        <button id="search-clear-btn" class="search-clear-btn" title="Clear search">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Views -->
    <main class="main-content">
      <!-- 1. Students List View -->
      <section id="view-students" class="view-section active">
        <div class="section-header">
          <h2 class="section-title">Students</h2>
        </div>
        <div id="student-list-container" class="student-list">
          <!-- Injected dynamically -->
        </div>
      </section>

      <!-- 2. Today's Attendance View -->
      <section id="view-attendance" class="view-section">
        <div id="attendance-view-content">
          <!-- Injected dynamically -->
        </div>
      </section>

      <!-- 3. Student Profile / Dashboard View -->
      <section id="view-student-detail" class="view-section">
        <div id="student-dashboard-content">
          <!-- Injected dynamically -->
        </div>
      </section>

      <!-- 4. Teacher Dashboard / Access View -->
      <section id="view-teacher" class="view-section">
        <div id="teacher-dashboard-content">
          <!-- Injected dynamically -->
        </div>
      </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-view="students">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <span>Students</span>
      </button>

      <button class="nav-item" data-view="attendance">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
        <span>Attendance</span>
      </button>

      <button class="nav-item" data-view="teacher">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
        <span>Teacher</span>
      </button>
    </nav>
  </div>

  <!-- ========================================================================
       MODALS
       ======================================================================== -->

  <!-- Monthly Attendance Calendar Modal -->
  <div id="calendar-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <div class="modal-title">Monthly Attendance</div>
          <span id="calendar-modal-student-name" style="font-size: 13px; color: var(--text-muted); font-weight: 500;"></span>
        </div>
        <button class="modal-close-btn" onclick="CalendarModalComponent.close()" title="Close">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="calendar-modal-content">
        <!-- Month Navigation -->
        <div class="calendar-nav-bar">
          <button class="month-nav-btn" onclick="CalendarModalComponent.prevMonth()" title="Previous month">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <div id="calendar-month-title" class="calendar-month-title">September 2026</div>
          <button class="month-nav-btn" onclick="CalendarModalComponent.nextMonth()" title="Next month">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>

        <!-- Weekday Headers -->
        <div class="calendar-weekdays">
          <span>Su</span>
          <span>Mo</span>
          <span>Tu</span>
          <span>We</span>
          <span>Th</span>
          <span>Fr</span>
          <span>Sa</span>
        </div>

        <!-- Days Grid -->
        <div id="calendar-days-grid" class="calendar-days-grid">
          <!-- Injected dynamically -->
        </div>

        <!-- Date Inspection Details Card -->
        <div id="calendar-inspection-card" class="calendar-inspection-card">
          <!-- Injected dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Student Modal -->
  <div id="student-form-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div id="student-form-title" class="modal-title">Add Student</div>
        <button class="modal-close-btn" onclick="TeacherDashboardComponent.closeStudentModal()" title="Close">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form onsubmit="TeacherDashboardComponent.handleSaveStudent(event)">
        <input type="hidden" id="student-form-id" />

        <div class="form-group">
          <label class="form-label" for="student-form-name">Student Name</label>
          <input type="text" id="student-form-name" class="form-input" placeholder="e.g. Abdullah Shaikh" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="student-form-father">Father Name</label>
          <input type="text" id="student-form-father" class="form-input" placeholder="e.g. Mohammed Shaikh" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="student-form-mobile">Mobile Number</label>
          <input type="tel" id="student-form-mobile" class="form-input" placeholder="e.g. 9820011223" required />
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="TeacherDashboardComponent.closeStudentModal()">Cancel</button>
          <button type="submit" class="btn-primary" style="width: auto; padding: 0 20px;">Save Student</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Student Confirmation Modal -->
  <div id="delete-student-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" style="color: var(--color-absent);">Delete Student</div>
        <button class="modal-close-btn" onclick="TeacherDashboardComponent.closeDeleteModal()" title="Close">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <p style="font-size: 14px; color: var(--text-main); margin-bottom: 8px;">
        Are you sure you want to delete <strong id="delete-student-name"></strong>?
      </p>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
        All associated attendance and Sabak records will be permanently removed.
      </p>

      <div class="form-actions">
        <button type="button" class="btn-secondary" onclick="TeacherDashboardComponent.closeDeleteModal()">Cancel</button>
        <button type="button" class="btn-primary" style="background: var(--color-absent); width: auto; padding: 0 18px;" onclick="TeacherDashboardComponent.confirmDeleteStudent()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Supabase JS CDN (Official v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Application Modules -->
  <script src="js/config.js"></script>
  <script src="js/dateUtils.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components/adsService.js"></script>
  <script src="js/components/calendarModal.js"></script>
  <script src="js/components/studentDashboard.js"></script>
  <script src="js/components/attendanceView.js"></script>
  <script src="js/components/studentList.js"></script>
  <script src="js/components/teacherDashboard.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
